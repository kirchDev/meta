# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# This repo integrates on `main` — no `dev` branch. The body reads the
# integration branch off the pull request's own base, so nothing here says it
# twice.
name: Queue Branch

on:
  pull_request:
    branches:
      - main
    types: [opened]

jobs:
  queue-branch:
    name: Queue Branch
    permissions:
      contents: read
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_queue-branch.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
