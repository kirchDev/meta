# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# None of these triggers carries a target branch, so the body resolves it by
# asking whether a `dev` branch exists. Here it does not, and the queue lands
# on `main` — with no value stated in this file.
name: Fast-forward Queue

on:
  push:
    branches:
      - 'ai/queue-**'
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Queue PR number to land; empty considers every open queue PR'
        required: false
        type: string

jobs:
  fast-forward-queue:
    name: Fast-forward Queue
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    uses: kirchDev/workflows/.github/workflows/_fast-forward-queue.yml@1e57db95ff601f03ae87b78e329ef238f9d0cbf6 # v0.8.2
    with:
      pr: ${{ inputs.pr }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
