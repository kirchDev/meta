# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The checks come from package.json's `check` script — which here ends in
# `pnpm validate`, a repo-specific step the body picks up without being told.
name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@c2c3c73a1b38c10e5d4a6dfa76c46749c03c1158 # v0.1.2
