# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Rebuilds projects.json — the one file kirch.dev fetches — and lands it on main
# through a pull request that merges itself. The PR is not there for a review
# (main requires one, but no approving review); it is there so CI still gates
# the change and so every sync leaves a record.
#
# Requires "Allow auto-merge" to be enabled in the repository settings —
# without it `gh pr merge --auto` fails and the PR stays open for a human.
#
# It needs no PAT: the built-in GITHUB_TOKEN reads public repository metadata,
# which is all this repository ever reads. Entries that opt out via
# `"github": false` are never fetched at all.
name: Sync Projects

on:
  push:
    branches: [main]
    paths:
      - projects/**
      - schema/**
      - scripts/**
      - .github/workflows/sync-projects.yml
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild projects.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The entries have to be sound before their facts are worth fetching — a
      # rebuild off a broken entry would propose a PR that drops a project.
      - name: Validate entries
        run: pnpm validate

      - name: Build projects.json
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Two comparisons against main, asking two different questions.
          #
          # `generatedAt` carries the build date, so it differs on every run
          # after midnight UTC. Comparing the file as a whole would therefore
          # open a pull request every single day with one changed line, and the
          # real changes would drown in that noise. Compare without it: the
          # stamp then says when the data last changed, not when it was checked.
          stamp='del(.generatedAt)'

          # The second question is whether the change is worth a human's
          # attention. Some of the fetched facts move on their own and say
          # nothing when they do: `updatedAt` follows any commit in the
          # repository, `stars` follows anyone's click, and inside `downloads`
          # the version, URL and size rotate with every release without
          # changing which installers the page offers. Compare with those gone
          # as well, and what is left over is exactly what earns an assignee.
          #
          # The platform/format pairs stay in that comparison on purpose: the
          # build only fails when *no* asset matches the platform table, so a
          # release that quietly stopped shipping one installer would otherwise
          # take a download button off the page unseen.
          moving="$stamp | .projects |= map(
            del(.updatedAt, .stars, .version)
            | if .downloads then .downloads |= map({ platform, format }) else . end
          )"

          same() {
            diff -q \
              <(git show HEAD:projects.json | jq -S "$1") \
              <(jq -S "$1" projects.json) >/dev/null
          }

          if same "$stamp"; then
            echo "No changes beyond the build date."
            exit 0
          fi

          assignee=
          if same "$moving"; then
            echo "Only push dates, stars and release URLs moved — leaving this one unassigned."
          else
            assignee=TitusKirch
            echo "Something beyond the moving facts changed — assigning $assignee."
          fi

          branch=bot/sync-projects
          base_sha=$(git rev-parse HEAD)

          # (Re)point the branch at the current main tip so it carries exactly
          # one commit on top of main, however many runs went into it.
          if gh api "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" \
              -f sha="$base_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$base_sha" >/dev/null
          fi

          # Commit through the Contents API rather than `git push`: commits made
          # this way with GITHUB_TOKEN are signed by GitHub and count as
          # "Verified", which a required_signatures rule on main insists on.
          #
          # The base64 content goes through a file, not a `$(...)` argument:
          # projects.json has grown past the point where its encoded size fits
          # in the OS argument-list limit, and `gh api ... content="$(...)"`
          # then fails with "Argument list too long" instead of committing.
          #
          # `printf '%s' "$(...)"` rather than a plain redirect: `base64 -w0`
          # always appends a trailing newline, which command substitution
          # used to strip when the value was inlined straight into the argv.
          #
          # `-F`, not `-f`: the "@file reads the value from disk" behaviour
          # is a `-F`/typed-field feature. `-f`/raw-field takes "@path" as a
          # literal string instead, so the field sent to the API was the
          # path itself — GitHub then rejects the path as "not valid Base64"
          # (HTTP 422), which reads like an encoding bug but is a flag typo.
          file_sha=$(gh api "repos/$GH_REPO/contents/projects.json?ref=$branch" --jq '.sha')
          content_file="$RUNNER_TEMP/projects.json.b64"
          printf '%s' "$(base64 -w0 projects.json)" >"$content_file"
          gh api -X PUT "repos/$GH_REPO/contents/projects.json" \
            -f message="chore: sync projects.json" \
            -f branch="$branch" \
            -f sha="$file_sha" \
            -F content="@$content_file" >/dev/null

          # Auto-merge rather than waiting for a human: `main` requires a pull
          # request but no approving review, so the only gate left is CI. The
          # PR still exists as a record and a red run still holds the merge —
          # the difference is only that nobody has to click.
          #
          # Squash is the sole merge method the ruleset permits, so it is not a
          # preference here: any other method would be refused.
          existing=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            echo "PR #$existing already open — updated it through the API."
            pr="$existing"
          else
            pr=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: sync projects.json" \
              --body "Automated rebuild of \`projects.json\` from the curated entries under \`projects/\` plus live GitHub repository metadata.")
            echo "Opened $pr"
          fi

          # Assign after the fact rather than at creation, so a pull request an
          # earlier run opened unassigned still picks one up once a later run
          # finds something worth reading — the branch is re-pointed at main
          # every time, so an open PR always carries the current diff. Nothing
          # ever unassigns it again: that diff is judged against main, and a
          # fact that earned a look does not stop having earned it.
          #
          # Auto-merge stays on either way. What an assignee is asked is "is
          # this right?", not "should this land?", and the answer to a wrong
          # entry is a commit under `projects/`, never a held pull request —
          # which the next run would overwrite mid-read in any case.
          if [ -n "$assignee" ]; then
            gh pr edit "$pr" --add-assignee "$assignee" >/dev/null
          fi

          # Enabling auto-merge is a repository setting, so this is the one step
          # that can fail on configuration rather than on content. Say so plainly
          # instead of leaving a bare API error, and still fail the run: a sync
          # that silently stops merging would look like nothing had changed.
          #
          # Even with auto-merge on, this PR's own CI can sit at "action_required"
          # rather than running: GitHub gates pull_request-triggered check runs
          # opened under the github-actions[bot] identity behind manual approval
          # in the Actions tab, separately from the Allow-auto-merge setting above.
          # No workflow-side retry fixes that: it needs a human (or anyone with
          # write access) to approve the run once, or the repository's Actions
          # settings changed to stop requiring it for this actor.
          if ! gh pr merge "$pr" --squash --auto; then
            echo "::error::Could not enable auto-merge. Check that 'Allow auto-merge' is on in the repository settings — the pull request is open and can be merged by hand. If it merges but CI on it shows 'action_required', approve the run from the Actions tab; this is separate from the auto-merge setting."
            exit 1
          fi
