# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Rebuilds projects.json — the one file kirch.dev fetches — and lands it on main
# through a pull request that merges itself. The PR is not there for a review
# (main requires one, but no approving review); it is there so CI still gates
# the change and so every sync leaves a record.
#
# Requires "Allow auto-merge" to be enabled in the repository settings —
# without it `gh pr merge --auto` fails and the PR stays open for a human.
#
# It needs no PAT: the built-in GITHUB_TOKEN reads public repository metadata,
# which is all this repository ever reads. Entries that opt out via
# `"github": false` are never fetched at all.
name: Sync Projects

on:
  push:
    branches: [main]
    paths:
      - projects/**
      - schema/**
      - scripts/**
      - .github/workflows/sync-projects.yml
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild projects.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The entries have to be sound before their facts are worth fetching — a
      # rebuild off a broken entry would propose a PR that drops a project.
      - name: Validate entries
        run: pnpm validate

      - name: Build projects.json
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # `generatedAt` carries the build date, so it differs on every run
          # after midnight UTC. Comparing the file as a whole would therefore
          # open a pull request every single day with one changed line, and the
          # real changes would drown in that noise. Compare without it: the
          # stamp then says when the data last changed, not when it was checked.
          if diff -q \
            <(git show HEAD:projects.json | grep -v '"generatedAt"') \
            <(grep -v '"generatedAt"' projects.json) >/dev/null; then
            echo "No changes beyond the build date."
            exit 0
          fi

          branch=bot/sync-projects
          base_sha=$(git rev-parse HEAD)

          # (Re)point the branch at the current main tip so it carries exactly
          # one commit on top of main, however many runs went into it.
          if gh api "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" \
              -f sha="$base_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$base_sha" >/dev/null
          fi

          # Commit through the Contents API rather than `git push`: commits made
          # this way with GITHUB_TOKEN are signed by GitHub and count as
          # "Verified", which a required_signatures rule on main insists on.
          #
          # The base64 content goes through a file, not a `$(...)` argument:
          # projects.json has grown past the point where its encoded size fits
          # in the OS argument-list limit, and `gh api -f content="$(...)"`
          # then fails with "Argument list too long" instead of committing.
          # `-f key=@file` reads the value from disk, which has no such cap.
          file_sha=$(gh api "repos/$GH_REPO/contents/projects.json?ref=$branch" --jq '.sha')
          content_file="$RUNNER_TEMP/projects.json.b64"
          base64 -w0 projects.json >"$content_file"
          gh api -X PUT "repos/$GH_REPO/contents/projects.json" \
            -f message="chore: sync projects.json" \
            -f branch="$branch" \
            -f sha="$file_sha" \
            -f content="@$content_file" >/dev/null

          # Auto-merge rather than waiting for a human: `main` requires a pull
          # request but no approving review, so the only gate left is CI. The
          # PR still exists as a record and a red run still holds the merge —
          # the difference is only that nobody has to click.
          #
          # Squash is the sole merge method the ruleset permits, so it is not a
          # preference here: any other method would be refused.
          existing=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            echo "PR #$existing already open — updated it through the API."
            pr="$existing"
          else
            pr=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: sync projects.json" \
              --body "Automated rebuild of \`projects.json\` from the curated entries under \`projects/\` plus live GitHub repository metadata." \
              --assignee TitusKirch)
            echo "Opened $pr"
          fi

          # Enabling auto-merge is a repository setting, so this is the one step
          # that can fail on configuration rather than on content. Say so plainly
          # instead of leaving a bare API error, and still fail the run: a sync
          # that silently stops merging would look like nothing had changed.
          if ! gh pr merge "$pr" --squash --auto; then
            echo "::error::Could not enable auto-merge. Check that 'Allow auto-merge' is on in the repository settings — the pull request is open and can be merged by hand."
            exit 1
          fi
